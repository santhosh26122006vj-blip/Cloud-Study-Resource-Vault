<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Cloud Study Resource Vault</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-icon-box">
          <i class="fa-solid fa-cloud"></i>
        </a>
        <h1>Create Student Account</h1>
        <p class="text-sm text-muted">Join the decentralized cloud study repository</p>
      </div>

      <form id="registerForm" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="regName" class="form-label">Full Name <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="regName" class="form-control" placeholder="Raj Kumar" required autocomplete="name">
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="regEmail" class="form-label">College Email Address <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="regEmail" class="form-control" placeholder="rajkumar@college.edu" required autocomplete="email">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="regPassword" class="form-label">Password <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <span class="form-hint">Must be at least 6 characters</span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-shield-check"></i>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" id="registerSubmitBtn" style="width: 100%; margin-top: 0.75rem;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have a student account? 
        <a href="login.html" style="font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { initAuthGuard, registerStudent, getFriendlyErrorMessage } from './js/auth.js';
    import { showToast } from './js/ui.js';

    // Guard: redirect if already logged in
    initAuthGuard({ requireAuth: false, publicOnly: true });

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('registerSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Creating Profile in Cloud...`;

      try {
        await registerStudent(name, email, password, confirmPassword);
        showToast("Account Created", "Your cloud study profile has been registered! Redirecting...", "success");

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (err) {
        console.error("Registration error:", err);
        showToast("Registration Failed", getFriendlyErrorMessage(err), "error");
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Create Account`;
      }
    });
  </script>
</body>
</html>
