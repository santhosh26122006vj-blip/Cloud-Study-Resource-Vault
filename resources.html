<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Resources - Cloud Study Resource Vault</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon-box" style="width:34px; height:34px; font-size:1rem;">
            <i class="fa-solid fa-cloud"></i>
          </div>
          <span>Study Vault</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Academic Portal</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-gauge"></i>
          <span>Dashboard</span>
        </a>
        <a href="resources.html" class="nav-item active">
          <i class="fa-solid fa-compass"></i>
          <span>Browse Resources</span>
        </a>
        <a href="admin.html" class="nav-item admin-only">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Admin Portal</span>
        </a>
        <a href="add-resource.html" class="nav-item">
          <i class="fa-solid fa-plus-circle"></i>
          <span>Add Resource</span>
        </a>
        <a href="favorites.html" class="nav-item">
          <i class="fa-solid fa-star"></i>
          <span>Favorites</span>
        </a>
        <div class="nav-section-title">Tools</div>
        <a href="image-to-pdf.html" class="nav-item">
          <i class="fa-solid fa-file-pdf"></i>
          <span>Image → PDF</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar-circle">S</div>
          <div class="user-snippet-info">
            <div class="user-snippet-name user-display-name">Loading...</div>
            <div class="user-snippet-role">
              <span class="badge badge-primary user-display-role" style="font-size:0.65rem; padding:0.15rem 0.45rem;">STUDENT</span>
            </div>
          </div>
          <button type="button" class="btn-icon btn-sm logout-trigger-btn" title="Sign Out" style="background:transparent; border-color:var(--sidebar-border); color:#cbd5e1;">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="app-main">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle-btn" id="menuToggle" title="Open Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title-wrapper">
            <h2>Study Resources Vault</h2>
          </div>
        </div>

        <div class="header-right">
          <a href="add-resource.html" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-plus"></i> Add Resource
          </a>
          <a href="favorites.html" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-star" style="color:#f59e0b;"></i> Favorites
          </a>
        </div>
      </header>

      <!-- Content -->
      <main class="app-content">

        <!-- Search & Filter Controls -->
        <div class="filter-toolbar">
          <!-- Top Row: Search & Sorting -->
          <div class="filter-row-top">
            <div class="input-icon-wrapper filter-search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="searchInput" class="form-control" placeholder="Search by title, subject, unit, file type, or description...">
            </div>

            <div style="display:flex; align-items:center; gap:0.5rem;">
              <label for="sortSelect" class="text-xs text-muted" style="font-weight:600;">SORT BY:</label>
              <select id="sortSelect" class="filter-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">Title (A - Z)</option>
                <option value="za">Title (Z - A)</option>
              </select>
            </div>
          </div>

          <!-- Bottom Row: Filter Dropdowns -->
          <div class="filter-row-bottom">
            <!-- Subject Filter -->
            <div>
              <select id="subjectFilter" class="filter-select">
                <option value="all">All Subjects</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="Computer Networks">Computer Networks</option>
                <option value="Database Management Systems">Database Management Systems</option>
                <option value="Database">Database</option>
                <option value="Web Technology">Web Technology</option>
                <option value="Java Programming">Java Programming</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Operating Systems">Operating Systems</option>
                <option value="Programming">Programming</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Unit Filter -->
            <div>
              <select id="unitFilter" class="filter-select">
                <option value="all">All Units</option>
                <option value="Unit 1">Unit 1</option>
                <option value="Unit 2">Unit 2</option>
                <option value="Unit 3">Unit 3</option>
                <option value="Unit 4">Unit 4</option>
                <option value="Unit 5">Unit 5</option>
                <option value="General">General / All Units</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- File Type Filter -->
            <div>
              <select id="typeFilter" class="filter-select">
                <option value="all">All File Types</option>
                <option value="PDF">PDF</option>
                <option value="PPT">PPT</option>
                <option value="PPTX">PPTX</option>
                <option value="DOC">DOC</option>
                <option value="DOCX">DOCX</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Reset Button -->
            <button type="button" class="btn btn-secondary btn-sm" id="resetFiltersBtn" style="margin-left:auto;">
              <i class="fa-solid fa-rotate-left"></i> Reset Filters
            </button>
          </div>
        </div>

        <!-- Results Counter Bar -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem;">
          <span class="badge badge-muted" id="resultsCount">Loading resources...</span>
        </div>

        <!-- Resources Grid -->
        <div class="resources-grid" id="resourcesBrowserGrid">
          <!-- Skeletons -->
          <div class="resource-card skeleton" style="height: 280px;"></div>
          <div class="resource-card skeleton" style="height: 280px;"></div>
          <div class="resource-card skeleton" style="height: 280px;"></div>
          <div class="resource-card skeleton" style="height: 280px;"></div>
          <div class="resource-card skeleton" style="height: 280px;"></div>
          <div class="resource-card skeleton" style="height: 280px;"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Resource Detail Modal Container -->
  <div id="resourceDetailModal" class="modal-overlay"></div>

  <!-- Scripts -->
  <script type="module" src="js/resources.js"></script>
</body>
</html>
