<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - Cloud Study Resource Vault</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="brand-logo">
          <div class="brand-icon-box" style="width:34px; height:34px; font-size:1rem;">
            <i class="fa-solid fa-cloud"></i>
          </div>
          <span>Study Vault</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Academic Portal</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-gauge"></i>
          <span>Dashboard</span>
        </a>
        <a href="resources.html" class="nav-item">
          <i class="fa-solid fa-compass"></i>
          <span>Browse Resources</span>
        </a>
        <a href="admin.html" class="nav-item admin-only">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Admin Portal</span>
        </a>
        <a href="add-resource.html" class="nav-item">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload Resource</span>
        </a>
        <a href="favorites.html" class="nav-item active">
          <i class="fa-solid fa-star"></i>
          <span>Favorites</span>
        </a>

        <div class="nav-section-title">Overview</div>
        <a href="index.html" class="nav-item">
          <i class="fa-solid fa-house"></i>
          <span>Landing Page</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar-circle">S</div>
          <div class="user-snippet-info">
            <div class="user-snippet-name user-display-name">Loading...</div>
            <div class="user-snippet-role">
              <span class="badge badge-primary user-display-role" style="font-size:0.65rem; padding:0.15rem 0.45rem;">STUDENT</span>
            </div>
          </div>
          <button type="button" class="btn-icon btn-sm logout-trigger-btn" title="Sign Out" style="background:transparent; border-color:var(--sidebar-border); color:#cbd5e1;">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="app-main">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle-btn" id="menuToggle" title="Open Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title-wrapper">
            <h2>Bookmarked Favorites</h2>
          </div>
        </div>

        <div class="header-right">
          <a href="resources.html" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-compass"></i> Explore All
          </a>
        </div>
      </header>

      <!-- Content -->
      <main class="app-content">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <div>
            <p class="text-sm text-muted">Your private vault of bookmarked lecture notes and study materials for quick exam revision.</p>
          </div>
          <div>
            <span class="badge badge-warning" id="favoritesCount" style="color:#b45309; background:#fef3c7;">Loading...</span>
          </div>
        </div>

        <!-- Resources Grid -->
        <div class="resources-grid" id="favoritesGrid">
          <div class="resource-card skeleton" style="height: 270px;"></div>
          <div class="resource-card skeleton" style="height: 270px;"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Resource Detail Modal Container -->
  <div id="resourceDetailModal" class="modal-overlay"></div>

  <!-- Scripts -->
  <script type="module" src="js/favorites.js"></script>
</body>
</html>
